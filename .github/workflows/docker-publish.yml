name: Docker Swarm Deployment Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-swarm-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: gestione-compiti:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create environment file
        run: |
          cat << EOF > .env
          POSTGRES_DB=gestione_compiti_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres_password
          JWT_PRIVATE_KEY=test_private_key
          JWT_PUBLIC_KEY=test_public_key
          JWT_EXPIRATION=86400
          RABBITMQ_USER=guest
          RABBITMQ_PASSWORD=guest
          RABBITMQ_HOST=rabbitmq
          RABBITMQ_PORT=5672
          EOF

      - name: Initialize Docker Swarm
        run: docker swarm init

      - name: Deploy stack
        run: |
          docker stack deploy -c docker-compose.yml gestione-compiti
          sleep 45

      - name: Verify service status
        run: |
          docker service ls
          docker service ps gestione-compiti_gestione-compiti --no-trunc

      - name: Check replicas count
        run: |
          REPLICAS=$(docker service ls --filter name=gestione-compiti_gestione-compiti --format "{{.Replicas}}")
          echo "Replicas status: $REPLICAS"
          if [[ ! "$REPLICAS" =~ "3/3" ]]; then
            echo "ERROR: Expected 3/3 replicas, found: $REPLICAS"
            docker service logs gestione-compiti_gestione-compiti --tail 50
            exit 1
          fi

      - name: Service logs on failure
        if: failure()
        run: docker service logs gestione-compiti_gestione-compiti --tail 100

      - name: Cleanup resources
        if: always()
        run: |
          docker stack rm gestione-compiti
          sleep 10
          docker swarm leave --force
