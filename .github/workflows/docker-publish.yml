name: Docker Swarm Deployment Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-swarm-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: gestione-compiti:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create environment file
        run: |
          cat << EOF > .env
          POSTGRES_DB=gestione_compiti_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres_password
          JWT_PRIVATE_KEY=test_private_key
          JWT_PUBLIC_KEY=test_public_key
          JWT_EXPIRATION=86400
          RABBITMQ_USER=guest
          RABBITMQ_PASSWORD=guest
          RABBITMQ_HOST=rabbitmq
          RABBITMQ_PORT=5672
          EOF

      - name: Initialize Docker Swarm
        run: docker swarm init

      - name: Deploy stack
        run: docker stack deploy -c docker-compose.yml gestione-compiti

      - name: Wait for services to be ready
        run: |
          echo "Waiting for 3/3 replicas to be running..."
          RETRY_COUNT=0
          MAX_RETRIES=24
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            REPLICAS=$(docker service ls --filter name=gestione-compiti_gestione-compiti --format "{{.Replicas}}")
            echo "Attempt $((RETRY_COUNT+1))/$MAX_RETRIES - Status: $REPLICAS"
            
            if [[ "$REPLICAS" =~ "3/3" ]]; then
              echo "SUCCESS: All 3 replicas are running"
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT+1))
            sleep 10
          done
          
          echo "TIMEOUT: Services did not reach 3/3 replicas after $((MAX_RETRIES*10)) seconds"
          docker service ls
          docker service ps gestione-compiti_gestione-compiti --no-trunc
          docker service logs gestione-compiti_gestione-compiti --tail 100
          exit 1

      - name: Verify final status
        run: |
          docker service ls
          docker service ps gestione-compiti_gestione-compiti

      - name: Cleanup resources
        if: always()
        run: |
          docker stack rm gestione-compiti
          sleep 10
          docker swarm leave --force
