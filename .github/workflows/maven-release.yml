name: Maven Automatic Releases

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Check commit message and extract version
      id: check
      run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          if [[ $COMMIT_MSG =~ ^(Update|Release)\ v\.([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
            echo "Release detected: v.${BASH_REMATCH[2]}"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "No release pattern found in commit message"
          fi

    - name: Build with Maven
      if: steps.check.outputs.should_release == 'true'
      run: mvn -B clean package -DskipTests

    - name: Create GitHub Release
      if: steps.check.outputs.should_release == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.check.outputs.version }}
        name: Release v${{ steps.check.outputs.version }}
        files: target/*.jar
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
