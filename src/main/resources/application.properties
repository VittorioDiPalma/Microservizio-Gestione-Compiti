spring.application.name=newunimol
spring.application.version=1.0.0

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestione_compiti}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Se non impostata, usa un valore di default per sviluppo
jwt.public-key=${JWT_PUBLIC_KEY}

# External Microservices URLs
gestione-corsi.url=${GESTIONE_CORSI_URL:http://localhost:8082}
gestione-iscrizioni.url=${GESTIONE_ISCRIZIONI_URL:http://localhost:8083}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
rabbitmq.exchange.name=newunimol.events

# Queue per eventi in uscita
rabbitmq.queue.assignment.created=assignment.created
rabbitmq.queue.assignment.updated=assignment.updated
rabbitmq.queue.assignment.deleted=assignment.deleted
rabbitmq.queue.submission.created=submission.created

# Queue per eventi in entrata
rabbitmq.queue.course.deleted=gestione-compiti.course.deleted
rabbitmq.queue.assessment.created=gestione-compiti.assessment.created
rabbitmq.queue.student.unenrolled=gestione-compiti.student.unenrolled

# File Upload Configuration
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
